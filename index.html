<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나는 땅기계 카드를 100가지 이상 말할 수 있다</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/main.js" defer></script>
</head>
<body>
  <main class="quiz-container">
    <h1>나는 땅기계 카드를 100가지 이상 말할 수 있다</h1>

    <div class="status">
      <span id="score">정답: 0</span>
      <span id="timer">걸린 시간: 00:00</span>
    </div>

    <div class="answer-area">
    <input
        type="text"
        id="answerInput"
        placeholder="카드 이름을 입력해 주세요"
        autocomplete="off"
        disabled
    >
    <button id="startButton" type="button">퀴즈 시작</button>
    <button id="hintButton" type="button" disabled>힌트</button>
    <button id="revealAllButton" type="button" disabled>전체 정답 보기</button>
    </div>


    <p id="feedback" aria-live="polite">
      퀴즈 시작 버튼을 눌러 주세요.
    </p>

    <section id="hintArea" aria-label="힌트 이미지">
      <p id="hintMessage">힌트를 누르면 아직 맞히지 못한 카드의 이미지가 잠깐 표시됩니다.</p>
      <img id="hintImage" alt="힌트 카드 이미지" hidden>
    </section>

    <div id="quizBoard"></div>
    <button id="topButton" type="button" aria-label="페이지 최상단으로 이동">^</button>
  </main>
</body>
</html>
