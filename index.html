<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나는 땅기계 카드를 100가지 이상 말할 수 있다</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="quiz-container">
        <h1>나는 땅기계 카드를 100가지 이상 말할 수 있다</h1>
        
        <div class="status">
            <p>정답 개수 : <span id="score">0</span> / 100</p>
            <p>남은 시간 : <span id="timer">10:00</span></p>
        </div>

        <form id="answerForm">
            <input
                type="text"
                id="answerInput"
                placeholder="카드 이름 입력"
                autocomplete="off"
            >

            <button type="hint">힌트</button>
        </form>

        <p id="feedback" aria-live="polite"></p>

        <h2>맞힌 카드</h2>
        <ul id="correctList"></ul>


        <button id="startButton">게임 시작</button>
    
    </main>
    <script src="js/cards.js"></script>
    <script src="js/main.js"></script>
        
</body>
</html>
